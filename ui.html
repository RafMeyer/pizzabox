<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PizzaBox</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#f5f5f5;color:#171717;user-select:none}#tabs{height:46px;padding:7px 10px 0 78px;display:flex;align-items:flex-end;gap:5px;background:#dedede;-webkit-app-region:drag}.tab{height:34px;min-width:130px;max-width:230px;padding:0 8px 0 13px;border-radius:9px 9px 0 0;background:#c9c9c9;display:flex;align-items:center;gap:7px;cursor:default;-webkit-app-region:no-drag}.tab.active{background:#fff}.tab-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.close{width:20px;height:20px;border:0;background:transparent;border-radius:50%;font-size:15px;line-height:18px;cursor:pointer}.close:hover{background:#bbb}#new-tab{width:31px;height:31px;border:0;background:transparent;border-radius:7px;font-size:22px;cursor:pointer;-webkit-app-region:no-drag}#new-tab:hover{background:#c5c5c5}#toolbar{height:60px;background:#fff;display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid #d6d6d6}.nav-button{width:36px;height:36px;border:0;border-radius:9px;background:transparent;font-size:20px;cursor:pointer}.nav-button:hover{background:#eee}.nav-button:disabled{opacity:.25}#address{height:38px;flex:1;border:1px solid #d4d4d4;background:#f3f3f3;border-radius:19px;outline:none;padding:0 17px;font-size:14px;user-select:text}#address:focus{background:#fff;border-color:#999}#brand{font-size:13px;font-weight:700;padding:0 6px;white-space:nowrap}
</style></head><body><div id="tabs"><button id="new-tab" title="New tab">+</button></div><div id="toolbar"><button id="back" class="nav-button" title="Back">←</button><button id="forward" class="nav-button" title="Forward">→</button><button id="reload" class="nav-button" title="Reload">↻</button><button id="home" class="nav-button" title="Home">⌂</button><input id="address" spellcheck="false" autocomplete="off" placeholder="Search or enter address"><div id="brand">PizzaBox 0.1</div></div><script>
const tabsBar=document.querySelector("#tabs"),addButton=document.querySelector("#new-tab"),address=document.querySelector("#address"),back=document.querySelector("#back"),forward=document.querySelector("#forward"),reload=document.querySelector("#reload"),home=document.querySelector("#home");
addButton.onclick=()=>window.pizzaBox.newTab();back.onclick=()=>window.pizzaBox.back();forward.onclick=()=>window.pizzaBox.forward();reload.onclick=()=>window.pizzaBox.reload();home.onclick=()=>window.pizzaBox.home();
address.addEventListener("keydown",e=>{if(e.key==="Enter"){window.pizzaBox.navigate(address.value);address.blur()}});
window.pizzaBox.onFocusAddress(()=>{address.focus();address.select()});
window.pizzaBox.onState(state=>{address.value=state.url||"";back.disabled=!state.canGoBack;forward.disabled=!state.canGoForward;document.querySelectorAll(".tab").forEach(el=>el.remove());for(const tab of state.tabs){const item=document.createElement("div");item.className="tab"+(tab.id===state.activeId?" active":"");const title=document.createElement("div");title.className="tab-title";title.textContent=tab.title||"New Tab";const close=document.createElement("button");close.className="close";close.textContent="×";item.onclick=e=>{if(!e.target.closest(".close"))window.pizzaBox.selectTab(tab.id)};close.onclick=e=>{e.stopPropagation();window.pizzaBox.closeTab(tab.id)};item.appendChild(title);item.appendChild(close);tabsBar.insertBefore(item,addButton)}});
</script></body></html>
